name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # A tag can be pushed from a branch CI never saw, and a release is the
      # one artifact that is awkward to take back. Cheap insurance.
      - name: Analyzer
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test

      # Signing material never touches the repository. The keystore is written
      # to a scratch directory and removed in an always() step below.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; a release must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # One build per ABI rather than --split-per-abi, which gives the split
      # APKs a different versionCode from the universal one (see the comment at
      # the end of android/app/build.gradle.kts). 2.0.0's universal APK refused
      # to install over its own arm64 APK because of it.
      - name: Build APKs
        run: |
          out=build/release-apks
          mkdir -p "$out"
          for pair in android-arm:armeabi-v7a android-arm64:arm64-v8a android-x64:x86_64; do
            platform=${pair%%:*}
            abi=${pair##*:}
            flutter build apk --release --target-platform "$platform" \
              -P onlyAbi="$abi" \
              --obfuscate --split-debug-info="build/symbols/$abi"
            cp build/app/outputs/flutter-apk/app-release.apk "$out/app-$abi-release.apk"
          done
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols/universal
          cp build/app/outputs/flutter-apk/app-release.apk "$out/app-release.apk"

      - name: Every APK carries the same versionCode
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          codes=$(for f in build/release-apks/*.apk; do
            "$aapt2" dump badging "$f" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p"
          done | sort -u)
          echo "versionCodes: $codes"
          if [ "$(echo "$codes" | wc -l)" -ne 1 ]; then
            echo "::error::APKs disagree on versionCode: $codes"
            exit 1
          fi
          # 4004 is the highest code any split APK has shipped with (2.0.0's
          # x86_64); anything at or below it cannot update that install.
          if [ "$codes" -le 4004 ]; then
            echo "::error::versionCode $codes must be above 4004"
            exit 1
          fi

      - name: Checksums
        run: |
          cd build/release-apks
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release-apks/*.apk
            build/release-apks/SHA256SUMS
          generate_release_notes: true

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
