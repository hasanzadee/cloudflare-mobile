name: Cloudflare spec update

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Tracking 2884 endpoints by hand is not a plan. This fetches the published
# OpenAPI description weekly, regenerates the client, and opens a PR whose diff
# shows exactly which allowlisted operations changed shape. The generated
# round-trip tests run against it, so a breaking rename fails in the same PR.
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # Cloudflare publishes the description at cloudflare/api-schemas. Verified
      # reachable; `curl -f` makes a move fail the job loudly rather than
      # silently committing an error page.
      - name: Fetch the current spec
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json \
            -o spec/openapi.json.new
          python3 -c "import json,sys; json.load(open('spec/openapi.json.new'))"
          if cmp -s spec/openapi.json spec/openapi.json.new; then
            echo "unchanged=true" >> "$GITHUB_ENV"
          else
            mv spec/openapi.json.new spec/openapi.json
            echo "unchanged=false" >> "$GITHUB_ENV"
          fi
          rm -f spec/openapi.json.new

      - if: env.unchanged == 'false'
        run: flutter pub get

      - if: env.unchanged == 'false'
        run: dart run tool/openapi/generate.dart

      # A spec change that breaks the app still opens the PR, as a draft that
      # says what broke. Failing before the PR meant every run from mid-October
      # on died here, red in a tab nobody watches, until someone went looking.
      # The PR is also the only check it gets: a PR opened with GITHUB_TOKEN
      # does not trigger the CI workflow.
      - if: env.unchanged == 'false'
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"

      - if: env.unchanged == 'false'
        id: tests
        continue-on-error: true
        run: flutter test

      - if: env.unchanged == 'false'
        name: Describe the result
        id: describe
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo 'body<<EOF'
            echo 'Automated refresh of `spec/openapi.json` plus regenerated client.'
            echo
            echo 'Review the diff under `lib/api/generated/` — it shows precisely'
            echo 'which allowlisted operations changed shape. `assets/spec/*.json`'
            echo 'changes are expected on every upstream release and are not worth'
            echo 'reading line by line.'
            echo
            echo "- analyzer: **$ANALYZE**"
            echo "- tests: **$TESTS**"
            if [ "$ANALYZE" != success ]; then
              echo
              echo 'The new spec breaks the app. Analyzer errors:'
              echo
              echo '```'
              grep -E '^\s*error ' "$RUNNER_TEMP/analyze.txt" | head -40
              echo '```'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          if [ "$ANALYZE" = success ] && [ "$TESTS" = success ]; then
            echo 'draft=false' >> "$GITHUB_OUTPUT"
          else
            echo 'draft=true' >> "$GITHUB_OUTPUT"
          fi

      - if: env.unchanged == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/spec-update
          title: 'chore(spec): refresh the Cloudflare API description'
          commit-message: 'chore(spec): refresh the Cloudflare API description'
          draft: ${{ steps.describe.outputs.draft }}
          body: ${{ steps.describe.outputs.body }}

      # Still red when the spec broke something, so the run list says so too.
      - if: env.unchanged == 'false' && steps.describe.outputs.draft == 'true'
        run: |
          echo "::error::The refreshed spec breaks the analyzer or the tests; see the draft PR."
          exit 1
