include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # The prototype read every API response as `Map<String, dynamic>['key']`.
    # These three turn that pattern into an analysis error rather than a
    # runtime surprise on a field Cloudflare renamed.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - lib/api/generated/**
    - test/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_parenthesis
    - use_string_buffers
    - use_super_parameters
