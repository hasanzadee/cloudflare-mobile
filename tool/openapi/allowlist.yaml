# Operations that get a typed, hand-reviewed client.
#
# Generating types for all 2884 operations is not viable: the spec carries 5815
# component schemas, and the transitive closure of even a small allowlist is
# ~6 schemas per operation. The remaining endpoints stay fully usable through
# the schema-aware API explorer, which reads assets/spec/*.json at runtime.
#
# Fields per entry:
#   id      operationId from the spec (unique — verified, zero duplicates)
#   as      Dart method name
#   group   Dart class the method lands on, e.g. `zones` -> ZonesApi
#   perms   permission group names this endpoint needs. Cloudflare never says
#           which permission is missing on a 403, so we say it for them.
#   union   how to treat anyOf/oneOf in the request body: flatten | manual

groups:
  zones: Zones and zone-level settings
  dns: DNS records
  accounts: Accounts, users and tokens
  cache: Cache purging
  waf: WAF, rate limiting and IP access rules
  workers: Workers, Pages, KV, D1 and R2
  zeroTrust: Tunnels, Access and Gateway
  traffic: Page rules, load balancing and waiting rooms
  tls: Certificates, custom hostnames and DNSSEC
  email: Email routing, Turnstile and alerts

operations:
  # --- Accounts / identity -------------------------------------------------
  - id: user-api-tokens-verify-token
    as: verifyToken
    group: accounts
    perms: []

  - id: accounts-list-accounts
    as: listAccounts
    group: accounts
    perms: [Account Settings Read]

  - id: accounts-account-details
    as: getAccount
    group: accounts
    perms: [Account Settings Read]

  - id: user-user-details
    as: getUser
    group: accounts
    perms: [User Details Read]

  - id: permission-groups-list-permission-groups
    as: listPermissionGroups
    group: accounts
    perms: [API Tokens Read]

  # --- Zones ---------------------------------------------------------------
  - id: zones-get
    as: listZones
    group: zones
    perms: [Zone Read]

  - id: zones-0-get
    as: getZone
    group: zones
    perms: [Zone Read]

  - id: zone-settings-get-all-zone-settings
    as: getAllSettings
    group: zones
    perms: [Zone Settings Read]

  - id: zone-settings-get-single-setting
    as: getSetting
    group: zones
    perms: [Zone Settings Read]

  - id: zone-settings-edit-single-setting
    as: editSetting
    group: zones
    perms: [Zone Settings Write]

  # --- Cache ---------------------------------------------------------------
  - id: zone-purge
    as: purge
    group: cache
    perms: [Cache Purge]
    union: flatten

  # --- DNS -----------------------------------------------------------------
  - id: dns-records-for-a-zone-list-dns-records
    as: listRecords
    group: dns
    perms: [DNS Read]

  - id: dns-records-for-a-zone-dns-record-details
    as: getRecord
    group: dns
    perms: [DNS Read]

  - id: dns-records-for-a-zone-create-dns-record
    as: createRecord
    group: dns
    perms: [DNS Write]
    # anyOf[dns-record-without-data, dns-record-with-data]: flattening is
    # correct here because the DNS editor already selects fields by `type`.
    union: flatten

  - id: dns-records-for-a-zone-update-dns-record
    as: updateRecord
    group: dns
    perms: [DNS Write]
    union: flatten

  - id: dns-records-for-a-zone-patch-dns-record
    as: patchRecord
    group: dns
    perms: [DNS Write]
    union: flatten

  - id: dns-records-for-a-zone-delete-dns-record
    as: deleteRecord
    group: dns
    perms: [DNS Write]

  - id: dns-records-for-a-zone-export-dns-records
    as: exportBind
    group: dns
    perms: [DNS Read]

  - id: dns-records-for-a-zone-import-dns-records
    as: importBind
    group: dns
    perms: [DNS Write]

  # --- WAF / Ruleset Engine ------------------------------------------------
  # Cloudflare exposes WAF custom rules, rate limiting and managed rulesets
  # through one Ruleset Engine API; the phase name selects which.
  - id: listZoneRulesets
    as: listRulesets
    group: waf
    perms: [Zone WAF Read]

  - id: getZoneRuleset
    as: getRuleset
    group: waf
    perms: [Zone WAF Read]

  - id: getZoneEntrypointRuleset
    as: getPhaseEntrypoint
    group: waf
    perms: [Zone WAF Read]

  - id: createZoneRulesetRule
    as: createRule
    group: waf
    perms: [Zone WAF Write]

  # Needed for the *first* rule in a phase. createRule wants a ruleset id, and
  # a zone that has never had a rule in this phase has no entry point ruleset
  # to give one — the GET above 404s. This PUT creates the ruleset and its
  # rules in one call.
  - id: updateZoneEntrypointRuleset
    as: putPhaseEntrypoint
    group: waf
    perms: [Zone WAF Write]

  - id: updateZoneRulesetRule
    as: updateRule
    group: waf
    perms: [Zone WAF Write]

  - id: deleteZoneRulesetRule
    as: deleteRule
    group: waf
    perms: [Zone WAF Write]

  - id: ip-access-rules-for-a-zone-list-ip-access-rules
    as: listIpAccessRules
    group: waf
    perms: [Firewall Services Read]

  - id: ip-access-rules-for-a-zone-create-an-ip-access-rule
    as: createIpAccessRule
    group: waf
    perms: [Firewall Services Write]

  - id: ip-access-rules-for-a-zone-delete-an-ip-access-rule
    as: deleteIpAccessRule
    group: waf
    perms: [Firewall Services Write]

  # --- Developer platform ---------------------------------------------------
  - id: worker-script-list-workers
    as: listScripts
    group: workers
    perms: [Workers Scripts Read]

  - id: worker-script-get-settings
    as: getScriptSettings
    group: workers
    perms: [Workers Scripts Read]

  - id: worker-cron-trigger-get-cron-triggers
    as: getCronTriggers
    group: workers
    perms: [Workers Scripts Read]

  - id: worker-routes-list-routes
    as: listRoutes
    group: workers
    perms: [Workers Routes Read]

  - id: pages-project-get-projects
    as: listPagesProjects
    group: workers
    perms: [Pages Read]

  - id: pages-deployment-get-deployments
    as: listPagesDeployments
    group: workers
    perms: [Pages Read]

  - id: workers-kv-namespace-list-namespaces
    as: listKvNamespaces
    group: workers
    perms: [Workers KV Storage Read]

  - id: d1-list-databases
    as: listD1Databases
    group: workers
    perms: [D1 Read]

  - id: d1-query-database
    as: queryD1
    group: workers
    perms: [D1 Write]

  - id: r2-list-buckets
    as: listR2Buckets
    group: workers
    perms: [Workers R2 Storage Read]

  # --- Zero Trust -----------------------------------------------------------
  - id: cloudflare-tunnel-list-cloudflare-tunnels
    as: listTunnels
    group: zeroTrust
    perms: [Cloudflare Tunnel Read]

  - id: cloudflare-tunnel-get-a-cloudflare-tunnel
    as: getTunnel
    group: zeroTrust
    perms: [Cloudflare Tunnel Read]

  - id: cloudflare-tunnel-list-cloudflare-tunnel-connections
    as: listTunnelConnections
    group: zeroTrust
    perms: [Cloudflare Tunnel Read]

  - id: access-applications-list-access-applications
    as: listAccessApps
    group: zeroTrust
    perms: [Access Apps and Policies Read]

  - id: access-policies-list-access-app-policies
    as: listAccessPolicies
    group: zeroTrust
    perms: [Access Apps and Policies Read]

  - id: zero-trust-gateway-rules-list-zero-trust-gateway-rules
    as: listGatewayRules
    group: zeroTrust
    perms: [Zero Trust Read]

  # --- KV keys and values ---------------------------------------------------
  # The only cursor-paginated listing in the app.
  - id: workers-kv-namespace-list-a-namespace'-s-keys
    as: listKvKeys
    group: workers
    perms: [Workers KV Storage Read]

  - id: workers-kv-namespace-read-key-value-pair
    as: readKvValue
    group: workers
    perms: [Workers KV Storage Read]

  - id: workers-kv-namespace-write-key-value-pair-with-metadata
    as: writeKvValue
    group: workers
    perms: [Workers KV Storage Write]

  - id: workers-kv-namespace-delete-key-value-pair
    as: deleteKvValue
    group: workers
    perms: [Workers KV Storage Write]

  # --- Workers / Pages writes ----------------------------------------------
  - id: worker-cron-trigger-update-cron-triggers
    as: updateCronTriggers
    group: workers
    perms: [Workers Scripts Write]

  - id: pages-deployment-retry-deployment
    as: retryDeployment
    group: workers
    perms: [Pages Write]

  - id: pages-deployment-rollback-deployment
    as: rollbackDeployment
    group: workers
    perms: [Pages Write]

  # --- Traffic: page rules, load balancing, waiting rooms -------------------
  - id: page-rules-list-page-rules
    as: listPageRules
    group: traffic
    perms: [Page Rules Read]

  - id: page-rules-edit-a-page-rule
    as: editPageRule
    group: traffic
    perms: [Page Rules Write]

  - id: page-rules-delete-a-page-rule
    as: deletePageRule
    group: traffic
    perms: [Page Rules Write]

  - id: load-balancers-list-load-balancers
    as: listLoadBalancers
    group: traffic
    perms: [Load Balancers Read]

  - id: account-load-balancer-pools-list-pools
    as: listPools
    group: traffic
    perms: [Load Balancers Read]

  - id: account-load-balancer-monitors-list-monitors
    as: listMonitors
    group: traffic
    perms: [Load Balancers Read]

  - id: waiting-room-list-waiting-rooms
    as: listWaitingRooms
    group: traffic
    perms: [Waiting Room Read]

  # --- TLS: certificates, custom hostnames, DNSSEC --------------------------
  - id: certificate-packs-list-certificate-packs
    as: listCertificatePacks
    group: tls
    perms: [SSL and Certificates Read]

  - id: universal-ssl-settings-for-a-zone-universal-ssl-settings-details
    as: getUniversalSsl
    group: tls
    perms: [SSL and Certificates Read]

  - id: universal-ssl-settings-for-a-zone-edit-universal-ssl-settings
    as: editUniversalSsl
    group: tls
    perms: [SSL and Certificates Write]

  - id: ssl-verification-ssl-verification-details
    as: getSslVerification
    group: tls
    perms: [SSL and Certificates Read]

  - id: custom-hostname-for-a-zone-list-custom-hostnames
    as: listCustomHostnames
    group: tls
    perms: [SSL and Certificates Read]

  - id: dnssec-dnssec-details
    as: getDnssec
    group: tls
